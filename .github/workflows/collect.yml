name: Collect ESPN data

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 5-6am ET, after the night's games are final
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect snapshot
        env:
          LEAGUE_ID: "286070"
          TEAM_ID: "5"
          # only needed if the league is made private
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          SEASON: "2027"
        run: python -m fantasy.collect
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%F)"
          git push
