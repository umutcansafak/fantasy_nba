name: Collect ESPN data and publish report

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC: night's games final (late West Coast tips end ~05:00-06:00 UTC);
                           # daily.json is up before 8am in Ireland (08:00 UTC winter, 07:00 UTC summer)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect snapshot
        env:
          LEAGUE_ID: "286070"
          TEAM_ID: "5"
          # only needed if the league is made private
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          SEASON: "2027"
        run: python -m fantasy.collect
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%F)"
          git push
      - name: Build report
        run: python -m fantasy.report --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
